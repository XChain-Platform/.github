# FINAL: destined for repo  XChain-Platform/.github  at path .github/workflows/ci-reusable.yml
#
# One shared CI definition every npm repo calls via `uses:`. Edit it here once and,
# because callers pin @master, every repo picks the change up on its next run,
# instead of editing ~9 near-identical ci.yml files. npm-only; xchain-wallet stays
# bespoke (pnpm + corepack ordering; see README.md).
name: ci-reusable

on:
  workflow_call:
    inputs:
      node-version:
        description: Node major version to run the gate on
        type: string
        default: "22"
      run-perf:
        description: Also run the performance suite after the gate (opt-in; off by default)
        type: boolean
        default: false
      perf-script:
        description: npm script for the perf suite; only used when run-perf is true
        type: string
        default: "test:perf"

# github.ref here resolves to the CALLER's ref, so this de-dupes per calling repo+branch.
#
# PROTECTED BRANCHES ARE EXEMPT FROM CANCELLATION, and that takes both lines
# below rather than the second one alone. A release is cut from a commit whose
# CI already passed, so a run that never reaches a verdict leaves that commit
# permanently unreleasable. `cancel-in-progress: false` protects a run that has
# already STARTED, but GitHub separately keeps only one PENDING run per
# concurrency group, so a newer push still evicts a queued one no matter what
# that flag says. Grouping per commit on master and develop removes the
# contention instead of arbitrating it: two commits are never in the same group,
# so neither can evict the other.
#
# Everywhere else keeps per-ref grouping and cancels freely, which is what you
# want on a pull request or a feature branch: only the newest push matters and
# runner minutes are the only cost.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.sha || 'ref' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run test gate
        run: npm run ci

      # Opt-in performance suite (run-perf: true). Kept in the same job so it runs
      # only after the gate passes and reuses the installed deps. Off by default, so
      # every current caller is unaffected until it explicitly opts in. Repos whose
      # perf suite needs a database wire their own service container in their ci.yml;
      # this step suits the infra-free suites (SDK) and self-skipping ones (hub).
      - name: Run performance suite
        if: ${{ inputs.run-perf }}
        run: npm run ${{ inputs.perf-script }}
